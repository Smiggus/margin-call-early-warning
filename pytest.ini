# pytest.ini  [Test runner settings]
[pytest]
testpaths = tests
python_files = test_*.py
pythonpath = .
norecursedirs = notebooks data models reports logs wandb .git __pycache__ .pytest_tmp
# Use disposable, repo-local test files to avoid some Windows temp permission issues.
# pytest clears ONLY the dedicated .pytest_tmp folder before each run.
# Keep it directly in the repo root: pytest does not create a missing parent folder.
# Admin must verify .gitignore excludes .pytest_tmp/
addopts = -q --basetemp=.pytest_tmp
