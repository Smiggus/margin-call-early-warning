# config.yaml  [Settings: single source of truth]
# -------------------------------------------------------------------
# Every non-secret setting the pipeline needs. Secrets go in .env.
# Values marked PROPOSED are open for review; evidence for the ranges is in
# docs/term_sheet_evidence.md and docs/term_sheet_evidence_round2.md.

profile: ci  # ci = small book that runs on GitHub runners; full = large book on own servers

paths:
  raw_prices: data/raw/prices.csv
  raw_rates: data/raw/rates.csv
  raw_data: data/raw/contract_days.csv
  processed_data: data/processed/clean.csv
  model: models/model.joblib
  inference_data: data/inference/contract_days_today.csv
  predictions: reports/predictions.csv
  metrics: reports/metrics.json
  log_file: logs/pipeline.log

data:
  source: yfinance
  start_date: "2018-01-01"
  end_date: "2025-12-31"
  tickers: [AAPL, TSLA, BTC-USD, RL, WSO, DDS, GPRO]
  price_column: close
  volume_column: volume
  rates:
    source: fred
    reference_rate: SOFR
    backfill_rate: EFFR  # SOFR starts April 2018; earlier days use EFFR

problem:
  target_column: called_within_5d
  problem_type: classification
  id_column: contract_id
  date_column: date
  horizon_days: 5

simulation:
  random_seed: 42
  origination: random
  products: [margin_loan, trs]
  # contracts per ticker per year, by profile and product (PROPOSED)
  contracts_per_ticker_per_year:
    ci: {margin_loan: 1, trs: 1}
    full: {margin_loan: 20, trs: 20}
  term_years_min: 2
  term_years_max: 3
  rate_type: floating  # fixed-rate contracts and their IRS hedges are out of scope
  financing:  # drawn per contract, annual rates (PROPOSED, evidence: 0.10% to 3.00%)
    spread_min: 0.0100
    spread_max: 0.0300
    desk_fee_min: 0.0010
    desk_fee_max: 0.0050
    upfront_fee: 0.0
  # one ladder engine for both products: exposure ratio vs
  # [opening, reset, call, enforcement]; release frees excess collateral
  margin_loan:
    ladders:  # opening, reset, call, enforcement (MDA II levels; reset rung PROPOSED)
      AAPL: [0.40, 0.45, 0.50, 0.65]
      TSLA: [0.40, 0.45, 0.50, 0.65]  # Musk 2022 real ladder for comparison: 0.20 / 0.25 / 0.35
      RL: [0.40, 0.45, 0.50, 0.65]
      BTC-USD: [0.25, 0.30, 0.35, 0.50]
      WSO: [0.30, 0.35, 0.40, 0.55]
      DDS: [0.30, 0.35, 0.40, 0.55]
      GPRO: [0.30, 0.35, 0.40, 0.55]
    release_offset: 0.05  # release when ratio <= opening - offset for release_days
    release_days: 5
    call_persistence_days: 1  # PROPOSED: Ping An uses 3 consecutive days
    cure_to: reset
    share_price_event: 0.40  # mandatory prepayment if price < 40% of initial (Musk 2022)
  trs:
    direction: long  # client long, bank hedged by holding the shares
    independent_amount_min: 0.075  # IA as share of notional, drawn per contract (PROPOSED)
    independent_amount_max: 0.30
    equity_reset_share: {monthly: 0.5, none: 0.5}  # share of TRS book per reset type
    collateral_mode_share: {remargined: 0.5, fixed_usd: 0.5}  # fixed_usd = Archegos pattern
    dividends_passthrough: true
    materiality_of_ia: 0.25  # a call counts only if the top-up exceeds 25% of the IA (PROPOSED)
    cure_to: opening
  all_borrowers_cure: true
  cure_days_default: 2
  cure_days_crypto: 1
  facility_usd_mm: {AAPL: 400, TSLA: 350, BTC-USD: 200, RL: 300, WSO: 250, DDS: 150, GPRO: 150}

split:  # by date, never random (PROPOSED dates)
  method: date
  train_end: "2021-12-31"
  validation_end: "2023-06-30"
  embargo_days: 5

features:
  volatility: {columns: [vol_21d, vol_63d, vol_of_vol_63d, drawdown_63d], windows: [21, 63]}
  liquidity: {columns: [adv_20d, days_to_liquidate], adv_window: 20, participation_rate: 0.15}
  contract: {columns: [product, current_ratio, distance_to_call, haircut, days_since_reset, ia_cover]}
  financing: {columns: [all_in_rate, accrued_financing]}

haircut:
  var_confidence: 0.99
  slow_sale_cap: 0.95
  block_discount: 0.085  # MDA II WSO figure only

model:  # PROPOSED
  family: HistGradientBoostingClassifier
  params: {max_iter: 200, learning_rate: 0.1, random_state: 42}
  warning_threshold: 0.50

validation:
  min_price: 0.0
  min_volume: 0
  ratio_min: 0.0
  ratio_max: 1.0
  max_missing_share: 0.0

quality_gate:
  metric_key: recall
  comparison: ">="
  threshold: 0.80
  floor: {metric_key: precision, comparison: ">=", threshold: 0.50}
  report_by: [product]  # recall and precision per product

business_kpi:
  name: median_lead_time_days
  baseline: null  # MDA II dynamic rule, to be measured
  target: "baseline + 1"

logging:
  level: INFO
